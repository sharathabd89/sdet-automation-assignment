# ---------------------------------------------------------------
# QA environment. Any key can be overridden: mvn test -Dheadless=false
# ---------------------------------------------------------------

# UI
ui.base.url=https://www.saucedemo.com
# chrome | firefox
browser=chrome
headless=true
explicit.wait.seconds=15

# API
api.base.url=https://restful-booker.herokuapp.com
# Credentials for POST /auth (override per environment: -Dapi.password=...)
api.username=admin
api.password=password123
api.max.response.time.ms=8000
# Request fails (and is retried) if the server does not answer in this time
api.timeout.ms=30000

# How many times a failed API test is re-run (public demo APIs can be flaky)
retry.count=1
